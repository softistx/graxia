name: Publish

# npm publishing runs here only, from a tag. Versions are made locally
# (`bun run changeset:version`, merged as a "Version packages" PR). The release
# owner then tags from an up-to-date `develop` (`bunx changeset git-tag &&
# git push --follow-tags`): a tag `v*` or `<pkg>@<x.y.z>` publishes every package
# whose version is not on npm yet. CI never tags. Several tags of one commit share
# the sha concurrency group, so the commit publishes once. scripts/publish.ts
# skips versions already on npm and refuses while changesets are pending.
on:
  push:
    tags: ["v*", "**@*"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LIBS || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      # Writes the npm auth config that reads $NODE_AUTH_TOKEN (no token on disk).
      - name: Configure npm registry
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Builds, checks the artifacts, then scripts/publish.ts (pack, assert, npm publish).
      - name: Publish
        run: bun run changeset:publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Once the @softistx/graxia* names are on npm, deprecates the old @graxia/*
      # ones ("moved to <new>"). Skips each pair until its new name is published,
      # and is idempotent. A failure is logged and never fails the publish.
      - name: Deprecate the moved @graxia packages
        continue-on-error: true
        run: bun scripts/deprecate-moved.ts || echo "::warning::deprecate-moved failed"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
