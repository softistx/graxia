name: Publish

# npm publishing runs here only, from a tag. Versions are made locally
# (`bun run changeset:version`, merged as a "Version packages" PR); pushing the
# tag `v<x.y.z>` publishes every package whose version is not on npm yet.
# scripts/publish.ts skips versions already on npm, so a re-run is safe.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LIBS || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      # Writes the npm auth config that reads $NODE_AUTH_TOKEN (no token on disk).
      - name: Configure npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Builds, checks the artifacts, then scripts/publish.ts (pack, assert, npm publish).
      - name: Publish
        run: bun run changeset:publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
